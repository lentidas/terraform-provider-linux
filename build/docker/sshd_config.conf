# Included by the stock /etc/ssh/sshd_config. Only for the disposable acceptance-test server.
PermitRootLogin yes
PubkeyAuthentication yes
PasswordAuthentication yes
UsePAM no
# The linux_local_forward data source tunnels through the server.
AllowTcpForwarding yes

# Every test connects from the same address, some of them failing authentication on purpose and the parallel test opening
# dozens of sessions at once. The default throttling and per-source penalties of sshd would then drop the later tests'
# connections, which shows up as "handshake failed: EOF".
PerSourcePenalties no
MaxStartups 500
