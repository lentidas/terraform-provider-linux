---
name: terraform-provider-linux-test

services:
  sshd:
    build: .
    image: terraform-provider-linux-test-sshd:local
    init: true
    environment:
      SSH_ROOT_PASSWORD: root
    # Generated by `mise run ssh-key`. Compose refuses to start without it instead of creating a directory in its place.
    volumes:
    - type: bind
      source: ../ssh/id_ed25519.pub
      target: /run/test-authorized-keys
      read_only: true
      bind:
        create_host_path: false
    ports:
    # Loopback only: root logs in with a well-known password.
    - "127.0.0.1:${TEST_ACC_LINUX_PROVIDER_PORT:-2222}:22"
