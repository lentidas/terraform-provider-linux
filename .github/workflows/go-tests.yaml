---
name: "go-tests"

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v6.0.2

    # Installs the Go version pinned in mise.toml, so CI and local development use the same toolchain.
    - name: Set up mise
      uses: jdx/mise-action@v5.3.0

    - name: Build code
      run: mise run build

    - name: Vet code
      run: mise run vet

    # The SSH communicator lives in a nested module that replaces github.com/hashicorp/terraform, so `./...` alone
    # does not cover it.
    - name: Run Go tests
      uses: robherley/go-test-action@v1.1.0
      with:
        testArguments: -race ./... github.com/hashicorp/terraform/communicator/...
        omit: |
          pie
          untested

  # Runs the acceptance tests against a throwaway SSH server built from build/docker, never against a real host.
  acceptance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out repository
      uses: actions/checkout@v6.0.2

    - name: Set up mise
      uses: jdx/mise-action@v5.3.0

    # Builds and starts the SSH server from build/docker first, then runs the tests against it.
    - name: Run acceptance tests
      run: mise run testacc
