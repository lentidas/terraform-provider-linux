# .goreleaser.yaml
# See https://goreleaser.com for full documentation
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - 386
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - id: default
    formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - id: default
    cmd: gpg
    artifacts: checksum
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase-fd
      - '0'
      - --local-user
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - '${signature}'
      - --detach-sign
      - '${artifact}'
    # The passphrase is read from stdin instead of the arguments, so it never shows up in the process list or in logs.
    stdin: '{{ .Env.GPG_PASSPHRASE }}'

release:
  draft: false

changelog:
  disable: true
